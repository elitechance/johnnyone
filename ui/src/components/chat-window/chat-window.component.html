<div class="chat-window">
  <div
    #messagesContainer
    class="messages-container"
    (scroll)="onMessagesScroll()">
    @if (showEmpty && messages.length === 0 && !isStreaming) {
      <div class="empty-state">
        <h3>{{ emptyTitle }}</h3>
        <p>{{ emptyDescription }}</p>
        @if (emptyHint) {
          <p class="empty-hint">{{ emptyHint }}</p>
        }
        <div class="empty-actions">
          <ng-content select="[chat-empty-actions]"></ng-content>
        </div>
      </div>
    }

    @for (message of messages; track trackByMessageId($index, message)) {
      <johnny-message-bubble
        [message]="message"
        [isStreamingMessage]="isStreamingMessage(message, $index)"
        class="message-item">
      </johnny-message-bubble>
    }

    @if (showTypingIndicator) {
      <div class="typing-indicator">
        <div class="message-header">
          <span class="message-role">Johnny</span>
        </div>
        <div class="typing-dots">
          <span></span><span></span><span></span>
        </div>
      </div>
    }
  </div>

  <ng-content select="[chat-meta]"></ng-content>

  <div class="composer-container">
    <johnny-message-composer
      (messageSent)="onMessageSent($event)"
      [disabled]="disabled"
      [placeholder]="placeholder">
    </johnny-message-composer>
    <ng-content select="[chat-actions]"></ng-content>
  </div>
</div>
