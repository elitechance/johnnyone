<section
  #terminalShell
  class="terminal-shell"
  [class.mobile-input-mode]="mobileInputMode"
  [class.grok-terminal-layout]="grokTerminalLayout"
>
  <header class="terminal-toolbar">
    <div class="terminal-title">{{ title }}</div>
    <div class="terminal-toolbar-actions">
      <div class="terminal-status" [class.offline]="screen?.status !== 'attached'">
        {{ screen?.status || 'detached' }}
      </div>
    </div>
  </header>
  <div #terminalHost class="terminal-host" [class.disabled]="disabled"></div>
  @if (copyToast) {
    <div class="terminal-copy-toast" role="status">{{ copyToast }}</div>
  }

  @if (showInput) {
    <form
      class="terminal-mobile-input"
      (pointerdown)="$event.stopPropagation()"
      (click)="$event.stopPropagation()"
      (submit)="$event.preventDefault(); submitTerminalInput()"
    >
      @if (sentMessages.length > 0) {
        <div class="terminal-sent-log" [class.open]="sentLogOpen">
          <button type="button" class="terminal-sent-log-toggle" (click)="toggleSentLog($event)">
            Your messages ({{ sentMessages.length }}) <span class="terminal-sent-caret">{{ sentLogOpen ? '▾' : '▸' }}</span>
          </button>
          @if (sentLogOpen) {
            <div class="terminal-sent-log-body">
              @for (msg of sentMessages; track msg.id) {
                <button type="button" class="terminal-sent-item" (click)="copySentMessage(msg, $event)" title="Tap to copy">
                  @if (msg.text) {
                    <span class="terminal-sent-text">{{ msg.text }}</span>
                  }
                  @if (msg.images.length > 0) {
                    <span class="terminal-sent-images">🖼 {{ msg.images.join(', ') }}</span>
                  }
                </button>
              }
            </div>
          }
        </div>
      }
      @if (imageAttachments.length > 0) {
        <div class="terminal-image-previews" aria-label="Selected images">
          @for (image of imageAttachments; track image.id) {
            <div class="terminal-image-preview">
              <img [src]="image.previewUrl" [alt]="image.fileName || 'Selected image'" />
              <button type="button" title="Remove image" (click)="imageRemoved.emit(image.id)" [disabled]="disabled || imageSending">×</button>
            </div>
          }
        </div>
      }
      <div class="terminal-mobile-keys" aria-label="Terminal controls">
        <input #terminalImageInput class="terminal-image-input" type="file" accept="image/*" multiple (change)="onTerminalImageBrowse($event)" />
        <button type="button" class="terminal-image-button" (click)="terminalImageInput.click()" [disabled]="disabled || imageSending">Upload image</button>
        <button type="button" (click)="sendControlInput('\t')" [disabled]="disabled">Tab</button>
        <button type="button" (click)="sendControlInput('\u001b')" [disabled]="disabled">Esc</button>
        <button type="button" (click)="sendControlInput('\u0003')" [disabled]="disabled">Ctrl-C</button>
        <button type="button" (click)="sendControlInput('\u001b[A')" [disabled]="disabled">↑</button>
        <button type="button" (click)="sendControlInput('\u001b[B')" [disabled]="disabled">↓</button>
        <button type="button" (click)="sendEnterInput()" [disabled]="disabled || imageSending">Enter</button>
      </div>

      <div class="terminal-mobile-submit">
        <textarea
          #mobileInput
          name="terminalInput"
          rows="1"
          placeholder="Type or paste command/message"
          [(ngModel)]="mobileInputBuffer"
          (keydown)="onMobileInputKeydown($event)"
          (paste)="onTerminalInputPaste($event)"
          [disabled]="disabled"
          autocapitalize="none"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        ></textarea>
        <button type="submit" [disabled]="disabled || imageSending">{{ imageSending ? 'Sending' : 'Send' }}</button>
      </div>
    </form>
  }
</section>
