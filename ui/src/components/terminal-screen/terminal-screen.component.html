<section #terminalShell class="terminal-shell" [class.mobile-input-mode]="mobileInputMode">
  <header class="terminal-toolbar">
    <div class="terminal-title">{{ title }}</div>
    <div class="terminal-toolbar-actions">
      @if (mermaidBlocks.length > 0) {
        <div class="terminal-mermaid-actions" aria-label="Terminal Mermaid diagrams">
          @for (block of mermaidBlocks; track block.id) {
            <button
              type="button"
              class="terminal-mermaid-button"
              (pointerdown)="$event.stopPropagation()"
              (click)="openMermaidBlock(block, $event)"
              title="Open Mermaid diagram"
            >
              {{ block.label }}
            </button>
          }
        </div>
      }
      <button
        type="button"
        class="terminal-history-button"
        [disabled]="!canLoadHistory()"
        (pointerdown)="$event.stopPropagation()"
        (click)="loadPreviousHistory($event)"
        title="Load previous terminal lines"
      >
        Previous 200
      </button>
      <span class="terminal-history-count" title="Loaded terminal history lines">
        {{ historyProgressText() }}
      </span>
      <div class="terminal-status" [class.offline]="screen?.status !== 'attached'">
        {{ screen?.status || 'detached' }}
      </div>
    </div>
  </header>
  @if (mermaidRenderError) {
    <div class="terminal-mermaid-error">{{ mermaidRenderError }}</div>
  }
  <div #terminalHost class="terminal-host" [class.disabled]="disabled"></div>

  @if (showInput) {
    <form
      class="terminal-mobile-input"
      (pointerdown)="$event.stopPropagation()"
      (click)="$event.stopPropagation()"
      (submit)="$event.preventDefault(); submitTerminalInput()"
    >
      <div class="terminal-mobile-keys" aria-label="Terminal controls">
        <button type="button" (click)="sendControlInput('\t')" [disabled]="disabled">Tab</button>
        <button type="button" (click)="sendControlInput('\u001b')" [disabled]="disabled">Esc</button>
        <button type="button" (click)="sendControlInput('\u0003')" [disabled]="disabled">Ctrl-C</button>
        <button type="button" (click)="sendControlInput('\u001b[A')" [disabled]="disabled">↑</button>
        <button type="button" (click)="sendControlInput('\u001b[B')" [disabled]="disabled">↓</button>
        <button type="button" (click)="sendControlInput('\r')" [disabled]="disabled">Enter</button>
      </div>

      <div class="terminal-mobile-submit">
        <textarea
          #mobileInput
          name="terminalInput"
          rows="1"
          placeholder="Type or paste command/message"
          [(ngModel)]="mobileInputBuffer"
          (keydown)="onMobileInputKeydown($event)"
          (paste)="onTerminalInputPaste($event)"
          [disabled]="disabled"
          autocapitalize="none"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        ></textarea>
        <button type="submit" [disabled]="disabled">Send</button>
      </div>
    </form>
  }
</section>
