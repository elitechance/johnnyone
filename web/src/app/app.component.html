<ion-app>
  <ion-split-pane contentId="main-content" when="(min-width: 900px)">
    <!-- §02 global icon nav rail (mock lines 542-549) — replaces the old ion-menu
         text sidebar. Widescreen only; the .botnav below covers mobile. -->
    @if (auth.isAuthenticated()) {
      <div class="gnav">
        <div class="glogo">J1</div>
        <button type="button" class="gplus" title="New…" aria-label="New…" (click)="openLauncher($event)">
          <ion-icon name="add-outline"></ion-icon>
        </button>
        @for (item of navItems; track item.id) {
          <a
            class="ni"
            [class.gspring]="item.id === 'settings'"
            [routerLink]="item.path"
            routerLinkActive="on"
            [title]="item.label"
            [attr.aria-label]="item.label"
          >
            <ion-icon [name]="item.icon"></ion-icon>
            <span class="cap">{{ item.label }}</span>
          </a>
        }
      </div>
    }

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>

  <!-- §08 mobile bottom nav (mock lines 1090-1095) — same four destinations from
       NAV_ITEMS, shown only at mobile width (viewport-keyed, 900px — D12). -->
  @if (auth.isAuthenticated()) {
    <nav class="botnav" aria-label="Primary">
      @for (item of navItems; track item.id) {
        <a class="b" [routerLink]="item.path" routerLinkActive="on" [attr.aria-label]="item.label">
          <ion-icon [name]="item.icon"></ion-icon>
          {{ item.label }}
        </a>
      }
    </nav>
  }

  <!-- Mermaid zoom modal — open via MermaidZoomService. Mounted once globally
       so any page (planner, terminal chat, etc.) can summon it. -->
  <app-mermaid-zoom-modal></app-mermaid-zoom-modal>
</ion-app>
