<ion-app>
  <ion-split-pane contentId="main-content" when="md" [class.side-menu-collapsed]="isMenuCollapsed()">
    <ion-menu contentId="main-content" type="overlay" *ngIf="auth.isAuthenticated()" [class.collapsed]="isMenuCollapsed()">
      <ion-content>
        <ion-list lines="none">
          <ion-list-header>
            <span class="menu-title">JohnnyOne</span>
            <ion-button
              fill="clear"
              size="small"
              class="menu-collapse-button"
              [attr.aria-label]="isMenuCollapsed() ? 'Expand side menu' : 'Collapse side menu'"
              [title]="isMenuCollapsed() ? 'Expand side menu' : 'Collapse side menu'"
              (click)="toggleSideMenu()"
            >
              <ion-icon slot="icon-only" [name]="isMenuCollapsed() ? 'chevron-forward-outline' : 'chevron-back-outline'"></ion-icon>
            </ion-button>
          </ion-list-header>

          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/terminal" routerLinkActive="ion-color-primary" lines="none" detail="false">
              <ion-icon slot="start" name="terminal-outline"></ion-icon>
              <ion-label>Terminal</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/planning" routerLinkActive="ion-color-primary" lines="none" detail="false">
              <ion-icon slot="start" name="document-text-outline"></ion-icon>
              <ion-label>Planning</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/development" routerLinkActive="ion-color-primary" lines="none" detail="false">
              <ion-icon slot="start" name="hammer-outline"></ion-icon>
              <ion-label>Development</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/files" routerLinkActive="ion-color-primary" lines="none" detail="false">
              <ion-icon slot="start" name="folder-outline"></ion-icon>
              <ion-label>Files</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/developer" routerLinkActive="ion-color-primary" lines="none" detail="false">
              <ion-icon slot="start" name="code-slash-outline"></ion-icon>
              <ion-label>Developer</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/settings" routerLinkActive="ion-color-primary" lines="none" detail="false">
              <ion-icon slot="start" name="settings-outline"></ion-icon>
              <ion-label>Settings</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>

        <ion-list lines="none" class="ion-margin-top">
          <ion-menu-toggle auto-hide="false">
            <ion-item button (click)="logout()" lines="none" detail="false">
              <ion-icon slot="start" name="log-out-outline"></ion-icon>
              <ion-label>Sign out</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>

  <!-- Draggable resizer pinned to the right edge of the side menu (md+ only). -->
  <div
    *ngIf="auth.isAuthenticated()"
    class="side-resizer"
    [class.dragging]="isResizing()"
    (mousedown)="startResize($event)"
    role="separator"
    aria-orientation="vertical"
    aria-label="Resize side menu"
  >
    <div class="side-resizer-handle"></div>
  </div>

  <!-- Mermaid zoom modal — open via MermaidZoomService. Mounted once globally
       so any page (planner, terminal chat, etc.) can summon it. -->
  <app-mermaid-zoom-modal></app-mermaid-zoom-modal>
</ion-app>
