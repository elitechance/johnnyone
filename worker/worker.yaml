worker:
  name: johnnyone-hub
  compatibility_date: "2026-03-02"

d1:
  database: johnnyone-db

modules:
  builtin:
    - name: auth
      features:
        password: true
        oauth: []
        passkey: false
  custom:
    schema: schema/
    d1: d1/
    resolvers: resolvers/

auth:
  provider: email
  jwt_expiry: 15m
  refresh_expiry: 7d

durable_objects:
  - name: CHAT_RELAY_DO
    class_name: ChatRelayDO
    file: lib/runtime/chat-relay-do.ts
    websocket_route: /api/relay/ws
