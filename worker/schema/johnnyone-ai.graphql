# --- File manager (overhaul P2, files_root-rooted) ---
# Global-rooted file surface (decision D2), separate from the plan-scoped HostFile* readers above.
# Field names/types mirror the host serde camelCase (host_files.rs) so resolvers are pure
# pass-throughs with no mapping.
