}

type AgentPlan {
  id: ID!
  runType: String!
  title: String!
  workspacePath: String!
  planPath: String!
  status: String!
  workerSessionId: String
  reviewerSessionId: String
  workerProvider: String!
  reviewerProvider: String!
  # Non-null on a planning row that binds a different agent for the development stage.
  devWorkerProvider: String
  devReviewerProvider: String
  currentPhaseId: String
  currentPhaseIndex: Int!
  error: String
  brief: String
  appScope: String
  docsScope: String
  referencePaths: String
  amendBrief: String
  # Configurable validation (overhaul phase 7, decision D1/D3): an opaque JSON array of review
  # lenses persisted on the Initiative. NULLABLE for the same deploy-skew reason as the initiative
  # axes below — a worker deploy against a not-yet-rebuilt (pre-migration 019) desktop returns JSON
  # without this key; nullable degrades to null. NULL/empty resolves to the default product/qa/lead
  # template in the desktop, so an unconfigured Initiative reviews exactly as before.
  validationConfig: String
  phaseRunMode: String!
  # Initiative axes (overhaul phase 1). Deliberately NULLABLE String (not String!) for
  # deploy-skew safety (decision D8): a worker deploy against a not-yet-rebuilt (pre-migration
  # 017) desktop returns JSON without these keys; nullable degrades to null instead of failing
  # non-null coercion on every AgentPlan-returning operation. Rust struct + ui typing stay
  # non-optional (values always present once migration 017 has run).
  initiativeId: String
  initiativeStatus: String
  health: String
  # Briefing conversation link (overhaul P4, D3). Nullable for the same deploy-skew reason as the
  # initiative axes above: a worker deploy against a not-yet-rebuilt (pre-migration 018) desktop
  # returns JSON without this key; nullable degrades to null. Non-null only on a briefing Initiative.
  briefingSessionId: String
  # Local-small executor mode JSON. NULL/empty = commercial. Deploy-skew nullable like validationConfig.
  executorConfig: String
  # Host consecutive_non_pass_planning_rounds for the initiative. Nullable for deploy-skew.
  consecutiveNonPassPlanningRounds: Int
  # The coordinator's own test gate (migration 023): shell commands it runs itself, from
  # workspacePath, when a phase reports ready. The host parses the stored JSON array and serves
  # this list, so no client ever handles the encoding. NULLABLE for the same deploy-skew reason as
  # validationConfig: a worker deploy against a pre-migration-023 desktop returns JSON without the
  # key, and nullable degrades to null instead of failing non-null coercion on every
  # AgentPlan-returning operation. Null or empty = no plan-level gate (opt-in).
  testCommands: [String!]
  createdAt: String!
  updatedAt: String!
}

type AgentPlanPhase {
  id: ID!
  planId: String!
  phaseId: String!
  phaseTitle: String!
  phaseIndex: Int!
  status: String!
  workerStartedAt: String
  workerIdleAt: String
  reviewerStartedAt: String
  reviewerIdleAt: String
  gateVerdict: String!
  clarificationAttempts: Int!
  summary: String
  findingsJson: String!
  createdAt: String!
  updatedAt: String!
  # This phase's OWN gate (migration 025). Nullable for deploy-skew, like the plan's above.
  # Null or empty means this phase declares no gate and inherits the plan's — see
  # effectiveTestCommands, which is the field to render and the field to trust.
  testCommands: [String!]
  # The gate that ACTUALLY applies to this phase: its own commands when it declares any, else the
  # plan's. Resolved on the host by `services::agent_plans::effective_test_commands`, the single
  # place that precedence lives, so no UI re-implements the fallback and no two clients can
  # disagree about what a phase is held to. Non-null: an empty list is the honest answer when
  # there is no gate at either level.
  #
  # Note the deploy-skew asymmetry with the nullable fields above is deliberate — a pre-025
  # desktop omits the key and a non-null list coerces to [] via the default, which is exactly the
  # correct "no gate" reading.
  effectiveTestCommands: [String!]!
}

# One run of a phase's (or a plan's) effective test gate — see the runAgentPlanTestGate mutation.
type TestGateRun {
  # Whether a gate was DECLARED at all, at either level.
  #
  # This is what separates "passed" from "there was nothing to pass". An exitCode of 0 is returned
  # both by a gate that ran every command successfully and by a phase that declares no gate, so a
  # client asking "is this phase proven?" must check `gateDeclared && exitCode == 0`. exitCode == 0
  # alone only means "nothing failed".
  #
  # true with commandsRun == 0 and a non-zero exitCode is the malformed case: a gate is configured
  # but its stored value could not be read, so nothing ran. That used to report exitCode 0 and was
  # indistinguishable from a pass.
  gateDeclared: Boolean!
  # The score. Zero means the gate passed; anything else is the exit code of the FIRST command
  # that failed (-1 when a signal killed it and no code was reported). This is the ONLY score the
  # gate has, by design: a numeric quality score would need a scale, a writer and an interpreter,
  # and each is a place for a false pass to hide.
  # Three reserved NEGATIVE values cover outcomes with no real exit code, so that a client
  # treating non-zero as failure refuses them without needing to know which: -1 killed by a
  # signal, -2 gate declared but unreadable, -3 exceeded the host's per-command timeout.
  exitCode: Int!
  # How many tests the run reported, parsed best-effort from its output.
  #
  # NULLABLE BY DESIGN, and null is NOT an error. A gate that prints nothing a parser recognises —
  # a lint, a build, a bespoke script, a runner whose summary format the host has never seen — is a
  # perfectly legitimate gate with a perfectly well-known exit code. Treat this as a display hint
  # only: never gate on it, never compare it across runs, never store it.
  collected: Int
  # The command whose exitCode is reported: the first failure, or the last command on success.
  # Null when the phase has no gate at either level.
  command: String
  # Commands actually executed — fewer than the gate declares when one failed and stopped the run.
  commandsRun: Int!
  # Captured stdout+stderr of the reported command, size-capped on the host (128 KiB per stream).
  output: String!
  # True when the cap discarded earlier output, so this is a tail window rather than the whole run.
  truncated: Boolean!
}

type AgentPlanTask {
  id: ID!
  planId: String!
  phaseId: String!
  taskId: String!
  taskTitle: String!
  taskIndex: Int!
  promptPath: String!
  statusPath: String
  decisionsPath: String
  status: String!
  createdAt: String!
  updatedAt: String!
}

type AgentPlanEvent {
  id: ID!
  planId: String!
  phaseId: String
  phaseIndex: Int
  phaseTitle: String
  eventType: String!
  actor: String!
  category: String!
  summary: String!
  statusBefore: String
  statusAfter: String
  reason: String
  verdict: String
  taskId: String
  clarificationAttempt: Int
  payloadJson: String!
  createdAt: String!
}

type AgentPlanRun {
  plan: AgentPlan!
  phases: [AgentPlanPhase!]!
  tasks: [AgentPlanTask!]!
  events: [AgentPlanEvent!]!
  # Mirror of `plan.briefingSessionId` at the run level for symmetry with the plan type (overhaul
  # P4). Nullable/deploy-skew-safe; the UI reads the conversation link via `plan.briefingSessionId`.
  briefingSessionId: String
}

type HostFileEntry {
  path: String!
  name: String!
  kind: String!
  status: String
  size: Int
}

type HostFileContent {
  path: String!
  name: String!
  kind: String!
  contentType: String!
  encoding: String!
  content: String!
  size: Int!
}

# --- File manager (overhaul P2, files_root-rooted) ---
# Global-rooted file surface (decision D2), separate from the plan-scoped HostFile* readers above.
# Field names/types mirror the host serde camelCase (host_files.rs) so resolvers are pure
# pass-throughs with no mapping.
type FileEntry {
  name: String!
  path: String!
  kind: String! # "file" | "dir"
  size: Int
  modified: Float
}

type DirListing {
  path: String!
  root: String!
  entries: [FileEntry!]!
}

type FileContent {
  path: String!
  name: String!
  contentType: String!
  encoding: String! # "utf8" | "base64"
  content: String!
  size: Int!
}

type FileOpResult {
  path: String!
  ok: Boolean!
}

type UploadChunkResult {
  path: String!
  received: Int!
  complete: Boolean!
}

type WorkspaceFileDiff {
  path: String!
  diff: String!
}

# Whole-tree working-tree diff (overhaul phase 7, D7/D10). One changed file with its +/- counts and
# hunk section; camelCase mirrors the Rust GitDiffFile/GitDiffView structs exactly (repoRoot, oldPath).
type GitDiffFile {
  path: String!
  oldPath: String
  additions: Int!
  deletions: Int!
  binary: Boolean!
  diff: String!
}

type GitDiffView {
  repoRoot: String
  branch: String
  clean: Boolean!
  files: [GitDiffFile!]!
}

type GitFilesView {
  path: String!
  repoRoot: String
  branch: String
  clean: Boolean!
  entries: [HostFileEntry!]!
}

type GitActionResult {
  success: Boolean!
  output: String!
}

type WorkspaceValidation {
  valid: Boolean!
  workspacePath: String!
  planPath: String!
  title: String
  phaseCount: Int!
  taskCount: Int!
  error: String
}

type PlannerPromptSettings {
  schema: String!
  development: PlannerDevelopmentPrompts!
  planning: PlannerPlanningPrompts!
  # Nullable for deploy-skew: a worker against a pre-cutover desktop has no smallMode key.
  smallMode: PlannerSmallModePrompts
}

type PromptLibraryEntry {
  id: ID!
  key: String!
  name: String!
  role: String!
  scope: String!
  version: String!
  usedCount: Int!
  customised: Boolean!
  readOnly: Boolean!
  engineReads: Boolean!
}

type PlannerSmallModePrompts {
  planner: String!
  reviewer: String!
  leafWrapper: String!
  amendPlanner: String!
}

type PlannerDevelopmentPrompts {
  worker: String!
  reviewer: String!
  # Nullable: pre-cutover desktop RPC omits the key. Null = desktop too old.
  workerNudge: String
}

type PlannerPlanningPrompts {
  planner: String!
  reviewer: String!
  # Nullable: pre-cutover desktop omits them. Null = desktop too old.
  amendPlanner: String
  amendReviewer: String
}

# --- Inputs ---

input RegisterDesktopNodeInput {
  hostname: String!
  os: String
  arch: String
  version: String
  capabilities: String
}

input RelayChatMessageInput {
  sessionId: String!
  content: String!
  provider: String
  model: String
  workingDirectory: String
}

input ChatAttachmentInput {
  sessionId: String
  originalName: String!
  contentType: String!
  dataBase64: String!
}

input MarkChatAttachmentDeliveredInput {
  id: ID!
  localPath: String!
}

input CreateAiSessionInput {
  title: String
  provider: String
  model: String
  workingDirectory: String
  # When set, the new terminal ATTACHES to this existing external tmux session
  # (e.g. "kloo") instead of spawning a new shell. Closing it only detaches.
  tmuxSessionName: String
}

# One persisted agent report (`reportAgentResult`). Mirrors the host type field-for-field so a
# single client query serves both surfaces.
type SessionReport {
  id: ID!
  sessionId: ID!
  kind: String!
  role: String
  summary: String
  markdown: String
  createdAt: String!
}

# An external tmux session a terminal can attach to.
type TmuxSession {
  name: String!
  attached: Boolean!
  windows: Int!
}

# Deterministic one-shot pane snapshot (overhaul P2). Mirrors the host `TerminalSnapshot` serde
# (terminal.rs, camelCase) so the resolver is a pure pass-through. The live stream still rides the
# `terminal_screen` broadcast; this is the request/response capture for automation/tests.
type TerminalScreen {
  sessionId: ID!
  tmuxSessionName: String!
  paneId: String!
  cursor: Int!
  content: String!
  cursorX: Int!
  cursorY: Int!
  historyLines: Int!
  rows: Int!
  cols: Int!
  status: String!
}

input UpsertProviderConfigInput {
  provider: String!
  cliPath: String
  apiKey: String
  defaultModel: String
  settings: String
}

input CreateAgentPlanInput {
  runType: String
  title: String
  workspacePath: String!
  planPath: String!
  workerProvider: String!
  reviewerProvider: String!
  brief: String
  appScope: String
  docsScope: String
  referencePaths: String
  # When workerProvider is "shell", these commands are run in the spawned shell
  # on first launch (e.g. cd into the app + start your agent CLI). Ignored for
  # non-shell providers. Avoid inline secrets — prefer `source ~/.env`.
  workerSetupCommands: String
  # Same, for a "shell" reviewerProvider — run in each spawned reviewer shell.
  reviewerSetupCommands: String
  # Per-stage provider binding for the continuous SDLC loop. Set these on a planning or briefing
  # create to say which agent BUILDS and which VALIDATES once planning hands off to development
  # (e.g. claude plans, grok builds, claude validates). Omit both to keep the previous behaviour,
  # where the development stage inherits whichever agent ran planning.
  devWorkerProvider: String
  devReviewerProvider: String
}

# Briefing loop (overhaul P4, D1). Create an Initiative at initiative_status='briefing' with a draft
# brief (the raw ask); providers are stored for the later planning kickoff on accept.
input CreateBriefingInput {
  title: String
  workspacePath: String!
  brief: String! # the raw ask
  workerProvider: String!
  reviewerProvider: String!
  model: String
  # Per-stage provider binding for the continuous SDLC loop. Set these on a planning or briefing
  # create to say which agent BUILDS and which VALIDATES once planning hands off to development
  # (e.g. claude plans, grok builds, claude validates). Omit both to keep the previous behaviour,
  # where the development stage inherits whichever agent ran planning.
  devWorkerProvider: String
  devReviewerProvider: String
  executorConfig: String
}

# Accept a briefing brief (overhaul P4, D1/D4): flips the same Initiative briefing→planning.
input AcceptBriefInput {
  initiativeId: ID!
  finalBrief: String # optional override of the stored draft
}

input PlannerPromptSettingsInput {
  development: PlannerDevelopmentPromptsInput!
  planning: PlannerPlanningPromptsInput!
  smallMode: PlannerSmallModePromptsInput
}

input PlannerSmallModePromptsInput {
  planner: String!
  reviewer: String!
  leafWrapper: String!
  amendPlanner: String!
}

input PlannerDevelopmentPromptsInput {
  worker: String!
  reviewer: String!
  # Omit/null keeps current (reverse-skew safe).
  workerNudge: String
}

input PlannerPlanningPromptsInput {
  planner: String!
  reviewer: String!
  amendPlanner: String
  amendReviewer: String
}

# --- Queries ---

type Query {
  listDesktopNodes: [DesktopNode!]!
  listAiSessions(status: String): [AiSession!]!
  listTmuxSessions: [TmuxSession!]!
  # A session's reports, oldest->newest, so a freshly-opened transcript is not blank.
  listSessionReports(sessionId: ID!, limit: Int): [SessionReport!]!
  # Deterministic one-shot pane capture (overhaul P2) — relay to host `capture_terminal`.
  captureTerminal(sessionId: ID!, historyLines: Int): TerminalScreen!
  getAiSession(id: ID!): AiSession
  listAiMessages(sessionId: ID!, limit: Int, offset: Int): [AiMessage!]!
  listProviderConfigs: [ProviderConfig!]!
  listDetectedCliTools: [DetectedTool!]!
  getSetting(key: String!): String!
  getPlannerPromptSettings: PlannerPromptSettings!
  listPromptLibrary: [PromptLibraryEntry!]!
  getPlanCheck(planId: ID!, phaseId: String): String
  getTaskRun(planId: ID!, phaseId: String!, taskId: String): String
  getKlooDoctor: String!
  getKlooProbe: String!
  listAgentPlans(status: String, runType: String, onlyExisting: Boolean): [AgentPlan!]!
  getAgentPlan(id: ID!): AgentPlanRun!
  "Full SDLC event timeline for one Initiative — the union of every plan-run's events (planning + development share one initiativeId), oldest-first."
  listInitiativeEvents(initiativeId: ID!): [AgentPlanEvent!]!
  browseHostDirectory(path: String!): [HostFileEntry!]!
  validateWorkspacePlan(workspacePath: String!, planPath: String!): WorkspaceValidation!
  listWorkspaceFiles(planId: ID!, mode: String!, path: String): [HostFileEntry!]!
  gitFileView(planId: ID!, path: String): GitFilesView!
  readHostFile(planId: ID!, path: String!): HostFileContent!
  getWorkspaceFileDiff(planId: ID!, path: String!): WorkspaceFileDiff!
  getChatAttachment(id: ID!): ChatAttachmentContent!
  # File manager (overhaul P2) — relay to the host files_root surface.
  # NOTE: the write ops (filesWrite/filesMkdir/filesRename/filesDelete/filesUploadChunk) and
  # initiativeUploadChunk live under Query (not Mutation) to satisfy lokal's resolver-file naming
  # convention: field type is inferred from the filename's leading verb, and `files-*` / `initiative-*`
  # are not mutation prefixes, so their resolvers auto-wire as Query. The client's query/mutate are the
  # same no-cache POST (graphql-client.ts), so there is no caching/idempotency concern — the resolvers
  # still perform the write, scope-gated by files:write. Keeps the cohesive files* namespace consistent.
  filesListDir(path: String!): DirListing!
  filesRead(path: String!): FileContent!
  filesWrite(path: String!, content: String!, encoding: String): FileOpResult!
  filesMkdir(path: String!): FileOpResult!
  filesRename(from: String!, to: String!): FileOpResult!
  filesDelete(path: String!): FileOpResult!
  filesUploadChunk(path: String!, chunkIndex: Int!, totalChunks: Int!, dataBase64: String!, done: Boolean!): UploadChunkResult!
  initiativeUploadChunk(initiativeId: ID!, path: String!, chunkIndex: Int!, totalChunks: Int!, dataBase64: String!, done: Boolean!): UploadChunkResult!
  # Whole-tree working-tree diff (overhaul P7, D7/D10) — path-keyed, scope-gated like the file ops.
  gitDiff(path: String!): GitDiffView!
}

# --- Mutations ---

type Mutation {
  createAiSession(input: CreateAiSessionInput!): AiSession!
  updateAiSessionTitle(id: ID!, title: String!): AiSession!
  updateAiSessionWorkingDirectory(id: ID!, workingDirectory: String!): AiSession!
  updateAiSessionProvider(id: ID!, provider: String!): AiSession!
  updateAiSessionArchived(id: ID!): AiSession!
  registerDesktopNode(input: RegisterDesktopNodeInput!): DesktopNode!
  updateDesktopNodeStatus(id: ID!, status: DesktopNodeStatus!): DesktopNode!
  sendRelayChatMessage(input: RelayChatMessageInput!): RelayChatResponse!
  cancelAiGeneration(sessionId: ID!): Boolean!
  deleteAiSession(id: ID!): Boolean!
  upsertProviderConfig(input: UpsertProviderConfigInput!): ProviderConfig!
  deleteProviderConfig(provider: String!): Boolean!
  updateSetting(key: String!, value: String!): Boolean!
  updatePlannerPromptSettings(input: PlannerPromptSettingsInput!): PlannerPromptSettings!
  createAgentPlan(input: CreateAgentPlanInput!): AgentPlanRun!
  startAgentPlan(id: ID!, phaseId: String, phaseRunMode: String): AgentPlanRun!
  # Unified run/resume: (re)start development at phaseId (null ⇒ current/paused phase) with an
  # OPTIONAL comment/guidance recorded + injected to the run's active session in the same action.
  runInitiativeFromPhase(id: ID!, phaseId: String, phaseRunMode: String, comment: String): AgentPlanRun!
  updateAgentPlanPhasesRefresh(id: ID!): AgentPlanRun!
  updateAgentPlanTitle(id: ID!, title: String!): AgentPlanRun!
  updateAgentPlanAppScope(id: ID!, appScope: String): AgentPlanRun!
  # Overhaul phase 7 (D1). Persist the Initiative's ordered validation-lens array as a JSON string;
  # a null/empty config clears it (→ desktop resolves the default product/qa/lead template).
  updateAgentPlanValidationConfig(id: ID!, config: String): AgentPlanRun!
  # Set — or explicitly clear — the coordinator's test gate (migrations 023 / 025). `phaseId`
  # picks the level: null writes the PLAN's gate, a phase id writes that phase's.
  #
  # `commands` is NON-NULL and clearing needs `clear: true`. Both are deliberate: with `commands`
  # optional and an empty list meaning "remove", `updateAgentPlanTestCommands(id: "x")` silently
  # wiped the Initiative-wide gate, which is the wrong thing for an incomplete call to do to a
  # mutation that sounds additive. Clearing is still how a level opts out — a cleared phase falls
  # back to the plan, a cleared plan means no gate at all — it just has to be asked for. Passing
  # both a non-empty `commands` and `clear: true` is rejected.
  updateAgentPlanTestCommands(id: ID!, phaseId: String, commands: [String!]!, clear: Boolean): AgentPlanRun!
  # Run a phase's (or the plan's) effective gate ONCE and report the outcome, without bouncing the
  # worker. Same resolution rule and same shell as the coordinator's automatic ready-check, so
  # what this reports is what the coordinator would see. Commands run sequentially from the plan's
  # workspacePath and stop at the first non-zero exit.
  runAgentPlanTestGate(id: ID!, phaseId: String): TestGateRun!
  updateAgentPlanAmend(id: ID!, brief: String!): AgentPlanRun!
  updateAgentPlanStopped(id: ID!): AgentPlanRun!
  deleteAgentPlan(id: ID!): Boolean!
  updateAgentPlanBlocked(id: ID!, reason: String!): AgentPlanRun!
  updateAgentPhaseManualPass(id: ID!, phaseId: String!): AgentPlanRun!
  sendAgentFeedbackToWorker(id: ID!): AgentPlanRun!
  retryAgentReviewer(id: ID!): AgentPlanRun!
  updateGitAction(planId: ID!, path: String, action: String!, message: String): GitActionResult!
  createChatAttachment(input: ChatAttachmentInput!): ChatAttachment!
  deleteChatAttachment(input: MarkChatAttachmentDeliveredInput!): ChatAttachment!
  # Briefing loop (overhaul P4) — thin desktopRpc pass-throughs to the Phase 01/02 host methods.
  # (filesWrite/filesMkdir/filesRename/filesDelete/filesUploadChunk + initiativeUploadChunk moved to
  # Query above to match lokal's resolver-filename type inference — see the note there.)
  createBriefingInitiative(input: CreateBriefingInput!): AgentPlanRun!
  acceptInitiativeBrief(input: AcceptBriefInput!): AgentPlanRun!
  addInitiativeReferencePath(initiativeId: ID!, path: String!): AgentPlanRun!
}

# --- Subscriptions ---

type Subscription {
  onDesktopNodeStatus: DesktopNode!
  onRelayChatDelta(relayId: String!): RelayChatDelta!
  onRelayChatMessage(sessionId: String!): RelayChatMessage!
}
