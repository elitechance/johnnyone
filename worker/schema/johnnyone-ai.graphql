  workingDirectory: String
  status: String!
  totalInputTokens: Float!
  totalOutputTokens: Float!
  totalCostCents: Float!
  createdAt: String!
  updatedAt: String!
  # True when this session attaches to an external tmux session (UI shows Detach).
  attachedTmux: Boolean!
}

type AiMessage {
  id: ID!
  sessionId: String!
  role: String!
  content: String!
  toolCalls: String
  finishReason: String
  inputTokens: Float!
  outputTokens: Float!
  costCents: Float!
  createdAt: String!
}

type ProviderConfig {
