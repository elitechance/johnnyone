  amendReviewer: String
}

# --- Queries ---

# --- The workflow arena (desktop migration 026) ---
#
# A Workflow is the SEARCHED ARTIFACT: the four prompt parts a phase-type is executed with, with
# `parentId` lineage. A champion is the one Workflow per (repo, phaseType, family) that J1 actually
# uses, and it materialises as an ordinary plan file, so the execution path is untouched.
#
# Every rule behind these fields lives on the host, in `services::workflows`, behind one named
# function each — `budgets_are_comparable`, `promotion_block`, `workflow_search_state`. No client
# re-derives any of them, for the same reason `AgentPlanPhase.effectiveTestCommands` exists.

type Workflow {
  id: ID!
  repo: String!
  # 'dev-phase', 'ui-phase', … The phase-type this workflow is a candidate for.
  phaseType: String!
  # The model family, e.g. 'glm-5.3-flash'. Part of a champion's IDENTITY, not its environment: a
  # hop tuned around one context window does not transfer to another, and treating the model as
  # environment is how a champion gets promoted that is worse everywhere it is actually used.
  family: String!
  # Monotonic WITHIN (repo, phaseType, family), starting at 1. Independent across families.
  version: Int!
  # Lineage. Always within the same (repo, phaseType, family) — the host refuses a cross-family
  # parent.
  parentId: String
  role: String!
  instruction: String!
  contract: String!
  # JSON: steps, parallel groups, returns. Served as the stored string; the host validates that it
  # IS JSON on write but deliberately does not model its shape.
  hop: String!
  # Seat cost, bounded by the fleet. At least 1.
  fanOut: Int!
  # Exactly one workflow per (repo, phaseType, family) can be true, enforced by a PARTIAL unique
  # index in the database, not only by the service.
  isChampion: Boolean!
  createdAt: String!
}

# One execution of one workflow.
type WorkflowRun {
  id: ID!
  workflowId: String!
  # The Initiative this run executed as, if any. Set to null if that plan is later deleted.
  planId: String
  # Replay index.
  seed: Int!
  # THE SCORE, and the only one. Zero means the gate passed. NULL means the gate never ran, which
  # is NOT a pass — `updateWorkflowChampion` refuses it. There is deliberately no numeric quality
  # score anywhere in this feature: a score needs a scale, a writer and an interpreter, and each is
  # a place for a false pass to hide.
  gateExit: Int
  # How many tests the gate reported. ADVISORY AND NULLABLE, and null is NOT an error: a gate that
  # prints nothing a parser recognises (a lint, a build, a bespoke script) is a perfectly
  # legitimate gate with a perfectly well-known exit code. Never gate on it, never rank on it. Its
  # one job is to let a human notice a suite that collects NOTHING — such a suite exits 0 and
  # scores every workflow identically, so the search would follow pure noise unreported.
  gateCollected: Int
  # JSON object, model → seats. The seat budget this run held; the comparability rule reads this.
  seatsHeld: String!
  # JSON object: fleet contention when the run started. Two concurrent runs contend, there is no
  # 429 to notice, and the slower one simply looks like the worse workflow — this is how a human
  # sees that instead of promoting a champion because the other box was quiet.
  fleetBusy: String!
  startedAt: String!
  endedAt: String
}

# One outcome: this run beat that run. Also the project-level measurement.
type WorkflowPref {
  id: ID!
  winnerRunId: String!
  loserRunId: String!
  # False when the two runs held DIFFERENT seat budgets. Computed by the host from the runs
  # themselves — it is not an argument, so a client cannot assert a comparability it does not have.
  # A non-comparable preference is still recorded (it happened) but CANNOT promote.
  comparable: Boolean!
  reason: String
  createdAt: String!
}

# The search's state for one (repo, phaseType, family) — the halt as DATA rather than a log line.
type WorkflowSearchState {
  repo: String!
  phaseType: String!
  family: String!
  # Rejections since the last promotion in this family, counted from the end of the decision log.
  consecutiveRejections: Int!
  # consecutiveRejections >= strikeLimit. While true the host REFUSES to start another run in this
  # family; the way out is a promotion, which resets the streak.
  halted: Boolean!
  strikeLimit: Int!
  # The trailing rejections' reasons, newest first — the one thing a halted search owes a human.
  recentRejections: [String!]!
  championWorkflowId: String
}

type Query {
  listDesktopNodes: [DesktopNode!]!
  listAiSessions(status: String): [AiSession!]!
  listTmuxSessions: [TmuxSession!]!
  # A session's reports, oldest->newest, so a freshly-opened transcript is not blank.
  listSessionReports(sessionId: ID!, limit: Int): [SessionReport!]!
  # Deterministic one-shot pane capture (overhaul P2) — relay to host `capture_terminal`.
  captureTerminal(sessionId: ID!, historyLines: Int): TerminalScreen!
  getAiSession(id: ID!): AiSession
  listAiMessages(sessionId: ID!, limit: Int, offset: Int): [AiMessage!]!
  listProviderConfigs: [ProviderConfig!]!
  listDetectedCliTools: [DetectedTool!]!
  getSetting(key: String!): String!
  getPlannerPromptSettings: PlannerPromptSettings!
  listPromptLibrary: [PromptLibraryEntry!]!
  getPlanCheck(planId: ID!, phaseId: String): String
  getTaskRun(planId: ID!, phaseId: String!, taskId: String): String
  getKlooDoctor: String!
  getKlooProbe: String!
  listAgentPlans(status: String, runType: String, onlyExisting: Boolean): [AgentPlan!]!
  getAgentPlan(id: ID!): AgentPlanRun!
  "Full SDLC event timeline for one Initiative — the union of every plan-run's events (planning + development share one initiativeId), oldest-first."
  listInitiativeEvents(initiativeId: ID!): [AgentPlanEvent!]!
  browseHostDirectory(path: String!): [HostFileEntry!]!
  validateWorkspacePlan(workspacePath: String!, planPath: String!): WorkspaceValidation!
  listWorkspaceFiles(planId: ID!, mode: String!, path: String): [HostFileEntry!]!
  gitFileView(planId: ID!, path: String): GitFilesView!
  readHostFile(planId: ID!, path: String!): HostFileContent!
  getWorkspaceFileDiff(planId: ID!, path: String!): WorkspaceFileDiff!
  getChatAttachment(id: ID!): ChatAttachmentContent!
  # File manager (overhaul P2) — relay to the host files_root surface.
  # NOTE: the write ops (filesWrite/filesMkdir/filesRename/filesDelete/filesUploadChunk) and
  # initiativeUploadChunk live under Query (not Mutation) to satisfy lokal's resolver-file naming
  # convention: field type is inferred from the filename's leading verb, and `files-*` / `initiative-*`
  # are not mutation prefixes, so their resolvers auto-wire as Query. The client's query/mutate are the
  # same no-cache POST (graphql-client.ts), so there is no caching/idempotency concern — the resolvers
  # still perform the write, scope-gated by files:write. Keeps the cohesive files* namespace consistent.
  filesListDir(path: String!): DirListing!
  filesRead(path: String!): FileContent!
  filesWrite(path: String!, content: String!, encoding: String): FileOpResult!
  filesMkdir(path: String!): FileOpResult!
  filesRename(from: String!, to: String!): FileOpResult!
  filesDelete(path: String!): FileOpResult!
  filesUploadChunk(path: String!, chunkIndex: Int!, totalChunks: Int!, dataBase64: String!, done: Boolean!): UploadChunkResult!
  initiativeUploadChunk(initiativeId: ID!, path: String!, chunkIndex: Int!, totalChunks: Int!, dataBase64: String!, done: Boolean!): UploadChunkResult!
  # Whole-tree working-tree diff (overhaul P7, D7/D10) — path-keyed, scope-gated like the file ops.
  gitDiff(path: String!): GitDiffView!
  # --- The workflow arena (desktop migration 026) ---
  # All three filters are optional and independent; absent means "any".
  workflows(repo: String, phaseType: String, family: String): [Workflow!]!
  workflow(id: ID!): Workflow!
  # A missing workflow is an ERROR here, not an empty list: "no runs yet" and "no such workflow"
  # are different answers and an empty arena cannot tell them apart.
  workflowRuns(workflowId: ID!): [WorkflowRun!]!
  workflowSearchState(repo: String!, phaseType: String!, family: String!): WorkflowSearchState!
}

# --- Mutations ---

type Mutation {
  createAiSession(input: CreateAiSessionInput!): AiSession!
  updateAiSessionTitle(id: ID!, title: String!): AiSession!
  updateAiSessionWorkingDirectory(id: ID!, workingDirectory: String!): AiSession!
  updateAiSessionProvider(id: ID!, provider: String!): AiSession!
  updateAiSessionArchived(id: ID!): AiSession!
  registerDesktopNode(input: RegisterDesktopNodeInput!): DesktopNode!
  updateDesktopNodeStatus(id: ID!, status: DesktopNodeStatus!): DesktopNode!
  sendRelayChatMessage(input: RelayChatMessageInput!): RelayChatResponse!
  cancelAiGeneration(sessionId: ID!): Boolean!
  deleteAiSession(id: ID!): Boolean!
  upsertProviderConfig(input: UpsertProviderConfigInput!): ProviderConfig!
  deleteProviderConfig(provider: String!): Boolean!
  updateSetting(key: String!, value: String!): Boolean!
  updatePlannerPromptSettings(input: PlannerPromptSettingsInput!): PlannerPromptSettings!
  createAgentPlan(input: CreateAgentPlanInput!): AgentPlanRun!
  startAgentPlan(id: ID!, phaseId: String, phaseRunMode: String): AgentPlanRun!
  # Unified run/resume: (re)start development at phaseId (null ⇒ current/paused phase) with an
  # OPTIONAL comment/guidance recorded + injected to the run's active session in the same action.
  runInitiativeFromPhase(id: ID!, phaseId: String, phaseRunMode: String, comment: String): AgentPlanRun!
  updateAgentPlanPhasesRefresh(id: ID!): AgentPlanRun!
  updateAgentPlanTitle(id: ID!, title: String!): AgentPlanRun!
  updateAgentPlanAppScope(id: ID!, appScope: String): AgentPlanRun!
  # Overhaul phase 7 (D1). Persist the Initiative's ordered validation-lens array as a JSON string;
  # a null/empty config clears it (→ desktop resolves the default product/qa/lead template).
  updateAgentPlanValidationConfig(id: ID!, config: String): AgentPlanRun!
  # Set — or explicitly clear — the coordinator's test gate (migrations 023 / 025). `phaseId`
  # picks the level: null writes the PLAN's gate, a phase id writes that phase's.
  #
  # `commands` is NON-NULL and clearing needs `clear: true`. Both are deliberate: with `commands`
  # optional and an empty list meaning "remove", `updateAgentPlanTestCommands(id: "x")` silently
  # wiped the Initiative-wide gate, which is the wrong thing for an incomplete call to do to a
  # mutation that sounds additive. Clearing is still how a level opts out — a cleared phase falls
  # back to the plan, a cleared plan means no gate at all — it just has to be asked for. Passing
  # both a non-empty `commands` and `clear: true` is rejected.
  updateAgentPlanTestCommands(id: ID!, phaseId: String, commands: [String!]!, clear: Boolean): AgentPlanRun!
  # Run a phase's (or the plan's) effective gate ONCE and report the outcome, without bouncing the
  # worker. Same resolution rule and same shell as the coordinator's automatic ready-check, so
  # what this reports is what the coordinator would see. Commands run sequentially from the plan's
  # workspacePath and stop at the first non-zero exit.
  runAgentPlanTestGate(id: ID!, phaseId: String): TestGateRun!
  updateAgentPlanAmend(id: ID!, brief: String!): AgentPlanRun!
  updateAgentPlanStopped(id: ID!): AgentPlanRun!
  deleteAgentPlan(id: ID!): Boolean!
  updateAgentPlanBlocked(id: ID!, reason: String!): AgentPlanRun!
  updateAgentPhaseManualPass(id: ID!, phaseId: String!): AgentPlanRun!
  sendAgentFeedbackToWorker(id: ID!): AgentPlanRun!
  retryAgentReviewer(id: ID!): AgentPlanRun!
  updateGitAction(planId: ID!, path: String, action: String!, message: String): GitActionResult!
  createChatAttachment(input: ChatAttachmentInput!): ChatAttachment!
  deleteChatAttachment(input: MarkChatAttachmentDeliveredInput!): ChatAttachment!
  # Briefing loop (overhaul P4) — thin desktopRpc pass-throughs to the Phase 01/02 host methods.
  # (filesWrite/filesMkdir/filesRename/filesDelete/filesUploadChunk + initiativeUploadChunk moved to
  # Query above to match lokal's resolver-filename type inference — see the note there.)
  createBriefingInitiative(input: CreateBriefingInput!): AgentPlanRun!
  acceptInitiativeBrief(input: AcceptBriefInput!): AgentPlanRun!
  addInitiativeReferencePath(initiativeId: ID!, path: String!): AgentPlanRun!
  # --- The workflow arena (desktop migration 026) ---
  # A new version is never born champion; becoming one is updateWorkflowChampion's job.
  createWorkflowVersion(repo: String!, phaseType: String!, family: String!, parentId: String, role: String!, instruction: String!, contract: String!, hop: String!, fanOut: Int!): Workflow!
  # REFUSED while the family's search is halted — that is what "three consecutive rejections halt
  # the search" means operationally.
  startWorkflowRun(workflowId: ID!, planId: String, seed: Int, seatsHeld: String!, fleetBusy: String!): WorkflowRun!
  # `gateExit` is NON-NULL: it is the score, and a missing score must be an error rather than a 0
  # that reads as a pass. `gateCollected` is advisory and omitting it is a NORMAL result.
  recordWorkflowRunGate(runId: ID!, gateExit: Int!, gateCollected: Int): WorkflowRun!
  # There is deliberately no `comparable` argument — see WorkflowPref.comparable.
  recordWorkflowPref(winnerRunId: ID!, loserRunId: ID!, reason: String): WorkflowPref!
  # PROMOTE: make this run's workflow the one champion of its (repo, phaseType, family), demoting
  # the incumbent in the SAME host transaction.
  #
  # `confirmed` is NON-NULL for the same reason `updateAgentPlanTestCommands.commands` is: this is
  # the arena's one irreversible step, and a call that forgot its arguments must be a validation
  # error rather than a promotion. The host defaults a missing value to false as well.
  #
  # Refused when the run's gateExit is NULL or non-zero, when the named preference is not
  # comparable or names a different winner, or when an incumbent champion exists and no comparable
  # preference was given. `prefId` may be omitted ONLY to seed a family's FIRST champion, where
  # there is nothing to compare against; its gate must still be green.
  updateWorkflowChampion(runId: ID!, prefId: String, confirmed: Boolean!): Workflow!
  # REJECT: saying no, with a reason. `reason` is non-null and the host also refuses a blank one —
  # three consecutive rejections halt the search and the reasons are all a halted search has to
  # show. Returns the resulting search state so the halt is data the caller already holds.
  recordWorkflowRejection(runId: ID!, reason: String!): WorkflowSearchState!
}

# --- Subscriptions ---

type Subscription {
  onDesktopNodeStatus: DesktopNode!
  onRelayChatDelta(relayId: String!): RelayChatDelta!
  onRelayChatMessage(sessionId: String!): RelayChatMessage!
}
