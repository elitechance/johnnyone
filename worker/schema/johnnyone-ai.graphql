}

input UpsertProviderConfigInput {
  provider: String!
  cliPath: String
  apiKey: String
  defaultModel: String
  settings: String
}

input CreateAgentPlanInput {
  runType: String
  title: String
  workspacePath: String!
  planPath: String!
  workerProvider: String!
  reviewerProvider: String!
  brief: String
  appScope: String
  docsScope: String
  referencePaths: String
  # When workerProvider is "shell", these commands are run in the spawned shell
  # on first launch (e.g. cd into the app + start your agent CLI). Ignored for
  # non-shell providers. Avoid inline secrets — prefer `source ~/.env`.
  workerSetupCommands: String
  # Same, for a "shell" reviewerProvider — run in each spawned reviewer shell.
  reviewerSetupCommands: String
  # Per-stage provider binding for the continuous SDLC loop. Set these on a planning or briefing
  # create to say which agent BUILDS and which VALIDATES once planning hands off to development
  # (e.g. claude plans, grok builds, claude validates). Omit both to keep the previous behaviour,
  # where the development stage inherits whichever agent ran planning.
  devWorkerProvider: String
  devReviewerProvider: String
}

# Briefing loop (overhaul P4, D1). Create an Initiative at initiative_status='briefing' with a draft
# brief (the raw ask); providers are stored for the later planning kickoff on accept.
input CreateBriefingInput {
  title: String
  workspacePath: String!
  brief: String! # the raw ask
  workerProvider: String!
  reviewerProvider: String!
  model: String
  # Per-stage provider binding for the continuous SDLC loop. Set these on a planning or briefing
  # create to say which agent BUILDS and which VALIDATES once planning hands off to development
  # (e.g. claude plans, grok builds, claude validates). Omit both to keep the previous behaviour,
  # where the development stage inherits whichever agent ran planning.
  devWorkerProvider: String
  devReviewerProvider: String
  executorConfig: String
}

# Accept a briefing brief (overhaul P4, D1/D4): flips the same Initiative briefing→planning.
input AcceptBriefInput {
  initiativeId: ID!
  finalBrief: String # optional override of the stored draft
}

input PlannerPromptSettingsInput {
  development: PlannerDevelopmentPromptsInput!
  planning: PlannerPlanningPromptsInput!
