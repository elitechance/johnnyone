# JohnnyOne AI GraphQL Schema
# Simplified to relay-only — all AI processing happens on desktop

# --- Enums ---

enum DesktopNodeStatus {
  online
  offline
  busy
}

# --- Types ---

type DesktopNode {
  id: ID!
  tenantId: String!
  userId: String!
  hostname: String!
  os: String
  arch: String
  version: String
  status: DesktopNodeStatus!
  capabilities: String!
  lastHeartbeatAt: String
  createdAt: String!
  updatedAt: String!
}

type AiSession {
  id: ID!
