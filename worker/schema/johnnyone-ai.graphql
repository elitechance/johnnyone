type AgentPlan {
  id: ID!
  runType: String!
  title: String!
  workspacePath: String!
  planPath: String!
  status: String!
  workerSessionId: String
  reviewerSessionId: String
  workerProvider: String!
  reviewerProvider: String!
  # Non-null on a planning row that binds a different agent for the development stage.
  devWorkerProvider: String
  devReviewerProvider: String
  currentPhaseId: String
  currentPhaseIndex: Int!
  error: String
  brief: String
  appScope: String
  docsScope: String
  referencePaths: String
  amendBrief: String
  # Configurable validation (overhaul phase 7, decision D1/D3): an opaque JSON array of review
  # lenses persisted on the Initiative. NULLABLE for the same deploy-skew reason as the initiative
  # axes below — a worker deploy against a not-yet-rebuilt (pre-migration 019) desktop returns JSON
  # without this key; nullable degrades to null. NULL/empty resolves to the default product/qa/lead
  # template in the desktop, so an unconfigured Initiative reviews exactly as before.
  validationConfig: String
  phaseRunMode: String!
  # Initiative axes (overhaul phase 1). Deliberately NULLABLE String (not String!) for
  # deploy-skew safety (decision D8): a worker deploy against a not-yet-rebuilt (pre-migration
  # 017) desktop returns JSON without these keys; nullable degrades to null instead of failing
  # non-null coercion on every AgentPlan-returning operation. Rust struct + ui typing stay
  # non-optional (values always present once migration 017 has run).
  initiativeId: String
  initiativeStatus: String
  health: String
  # Briefing conversation link (overhaul P4, D3). Nullable for the same deploy-skew reason as the
  # initiative axes above: a worker deploy against a not-yet-rebuilt (pre-migration 018) desktop
  # returns JSON without this key; nullable degrades to null. Non-null only on a briefing Initiative.
  briefingSessionId: String
  # Local-small executor mode JSON. NULL/empty = commercial. Deploy-skew nullable like validationConfig.
  executorConfig: String
  # Host consecutive_non_pass_planning_rounds for the initiative. Nullable for deploy-skew.
  consecutiveNonPassPlanningRounds: Int
  # The coordinator's own test gate (migration 023): shell commands it runs itself, from
  # workspacePath, when a phase reports ready. The host parses the stored JSON array and serves
  # this list, so no client ever handles the encoding. NULLABLE for the same deploy-skew reason as
  # validationConfig: a worker deploy against a pre-migration-023 desktop returns JSON without the
  # key, and nullable degrades to null instead of failing non-null coercion on every
  # AgentPlan-returning operation. Null or empty = no plan-level gate (opt-in).
  testCommands: [String!]
  createdAt: String!
  updatedAt: String!
}

type AgentPlanPhase {
  id: ID!
  planId: String!
  phaseId: String!
  phaseTitle: String!
  phaseIndex: Int!
  status: String!
  workerStartedAt: String
  workerIdleAt: String
  reviewerStartedAt: String
  reviewerIdleAt: String
  gateVerdict: String!
  clarificationAttempts: Int!
  summary: String
  findingsJson: String!
  createdAt: String!
  updatedAt: String!
  # This phase's OWN gate (migration 025). Nullable for deploy-skew, like the plan's above.
  # Null or empty means this phase declares no gate and inherits the plan's — see
  # effectiveTestCommands, which is the field to render and the field to trust.
  testCommands: [String!]
  # The gate that ACTUALLY applies to this phase: its own commands when it declares any, else the
  # plan's. Resolved on the host by `services::agent_plans::effective_test_commands`, the single
  # place that precedence lives, so no UI re-implements the fallback and no two clients can
  # disagree about what a phase is held to. Non-null: an empty list is the honest answer when
  # there is no gate at either level.
  #
  # Note the deploy-skew asymmetry with the nullable fields above is deliberate — a pre-025
  # desktop omits the key and a non-null list coerces to [] via the default, which is exactly the
  # correct "no gate" reading.
  effectiveTestCommands: [String!]!
}

# One run of a phase's (or a plan's) effective test gate — see the runAgentPlanTestGate mutation.
type TestGateRun {
  # Whether a gate was DECLARED at all, at either level.
  #
  # This is what separates "passed" from "there was nothing to pass". An exitCode of 0 is returned
  # both by a gate that ran every command successfully and by a phase that declares no gate, so a
  # client asking "is this phase proven?" must check `gateDeclared && exitCode == 0`. exitCode == 0
  # alone only means "nothing failed".
  #
  # true with commandsRun == 0 and a non-zero exitCode is the malformed case: a gate is configured
  # but its stored value could not be read, so nothing ran. That used to report exitCode 0 and was
  # indistinguishable from a pass.
  gateDeclared: Boolean!
  # The score. Zero means the gate passed; anything else is the exit code of the FIRST command
  # that failed (-1 when a signal killed it and no code was reported). This is the ONLY score the
  # gate has, by design: a numeric quality score would need a scale, a writer and an interpreter,
  # and each is a place for a false pass to hide.
  # Three reserved NEGATIVE values cover outcomes with no real exit code, so that a client
  # treating non-zero as failure refuses them without needing to know which: -1 killed by a
  # signal, -2 gate declared but unreadable, -3 exceeded the host's per-command timeout.
  exitCode: Int!
  # How many tests the run reported, parsed best-effort from its output.
  #
  # NULLABLE BY DESIGN, and null is NOT an error. A gate that prints nothing a parser recognises —
  # a lint, a build, a bespoke script, a runner whose summary format the host has never seen — is a
  # perfectly legitimate gate with a perfectly well-known exit code. Treat this as a display hint
  # only: never gate on it, never compare it across runs, never store it.
  collected: Int
  # The command whose exitCode is reported: the first failure, or the last command on success.
  # Null when the phase has no gate at either level.
  command: String
  # Commands actually executed — fewer than the gate declares when one failed and stopped the run.
  commandsRun: Int!
  # Captured stdout+stderr of the reported command, size-capped on the host (128 KiB per stream).
  output: String!
  # True when the cap discarded earlier output, so this is a tail window rather than the whole run.
  truncated: Boolean!
}

type AgentPlanTask {
  id: ID!
  planId: String!
  phaseId: String!
  taskId: String!
  taskTitle: String!
  taskIndex: Int!
