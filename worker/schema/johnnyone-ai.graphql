# JohnnyOne AI GraphQL Schema
# Simplified to relay-only — all AI processing happens on desktop

# --- Enums ---

enum DesktopNodeStatus {
  online
  offline
  busy
}

# --- Types ---

type DesktopNode {
  id: ID!
  tenantId: String!
  userId: String!
  hostname: String!
  os: String
  arch: String
  version: String
  status: DesktopNodeStatus!
  capabilities: String!
  lastHeartbeatAt: String
  createdAt: String!
  updatedAt: String!
}

type AiSession {
  id: ID!
  title: String!
  provider: String!
  model: String!
  workingDirectory: String
  status: String!
  totalInputTokens: Int!
  totalOutputTokens: Int!
  totalCostCents: Int!
  createdAt: String!
  updatedAt: String!
}

type AiMessage {
  id: ID!
  sessionId: String!
  role: String!
  content: String!
  toolCalls: String
  finishReason: String
  inputTokens: Int!
  outputTokens: Int!
  costCents: Int!
  createdAt: String!
}

type ProviderConfig {
  id: ID!
  provider: String!
  cliPath: String!
  apiKey: String!
  defaultModel: String!
  settings: String!
  isAvailable: Boolean!
  updatedAt: String!
}

type DetectedTool {
  provider: String!
  command: String!
  found: Boolean!
  path: String
}

type AiChatRunResult {
  userMessage: AiMessage!
  assistantMessage: AiMessage!
}

type AiChatDelta {
  sessionId: String!
  messageId: String!
  delta: String!
  chunkType: String!
  isFinal: Boolean!
}

type AiChatComplete {
  sessionId: String!
  messageId: String!
}

type RelayChatResponse {
  success: Boolean!
  relayId: String!
  desktopNodeId: String!
}

type RelayChatDelta {
  relayId: String!
  sessionId: String!
  delta: String!
  chunkType: String!
  isFinal: Boolean!
}

type RelayChatMessage {
  relayId: String!
  sessionId: String!
  role: String!
  content: String!
}

type AgentPlan {
  id: ID!
  runType: String!
  title: String!
  workspacePath: String!
  planPath: String!
  status: String!
  workerSessionId: String
  reviewerSessionId: String
  workerProvider: String!
  reviewerProvider: String!
  currentPhaseId: String
  currentPhaseIndex: Int!
  error: String
  brief: String
  appScope: String
  docsScope: String
  referencePaths: String
  createdAt: String!
  updatedAt: String!
}

type AgentPlanPhase {
  id: ID!
  planId: String!
  phaseId: String!
  phaseTitle: String!
  phaseIndex: Int!
  status: String!
  workerStartedAt: String
  workerIdleAt: String
  reviewerStartedAt: String
  reviewerIdleAt: String
  gateVerdict: String!
  clarificationAttempts: Int!
  summary: String
  findingsJson: String!
  createdAt: String!
  updatedAt: String!
}

type AgentPlanTask {
  id: ID!
  planId: String!
  phaseId: String!
  taskId: String!
  taskTitle: String!
  taskIndex: Int!
  promptPath: String!
  statusPath: String
  decisionsPath: String
  status: String!
  createdAt: String!
  updatedAt: String!
}

type AgentPlanEvent {
  id: ID!
  planId: String!
  phaseId: String
  eventType: String!
  payloadJson: String!
  createdAt: String!
}

type AgentPlanRun {
  plan: AgentPlan!
  phases: [AgentPlanPhase!]!
  tasks: [AgentPlanTask!]!
  events: [AgentPlanEvent!]!
}

type HostFileEntry {
  path: String!
  name: String!
  kind: String!
  status: String
  size: Int
}

type HostFileContent {
  path: String!
  name: String!
  kind: String!
  contentType: String!
  encoding: String!
  content: String!
  size: Int!
}

type WorkspaceFileDiff {
  path: String!
  diff: String!
}

type WorkspaceValidation {
  valid: Boolean!
  workspacePath: String!
  planPath: String!
  title: String
  phaseCount: Int!
  taskCount: Int!
  error: String
}

type PlannerPromptSettings {
  schema: String!
  development: PlannerDevelopmentPrompts!
  planning: PlannerPlanningPrompts!
}

type PlannerDevelopmentPrompts {
  worker: String!
  reviewer: String!
}

type PlannerPlanningPrompts {
  planner: String!
  reviewer: String!
}

# --- Inputs ---

input RegisterDesktopNodeInput {
  hostname: String!
  os: String
  arch: String
  version: String
  capabilities: String
}

input RelayChatMessageInput {
  sessionId: String!
  content: String!
  provider: String
  model: String
  workingDirectory: String
}

input CreateAiSessionInput {
  title: String
  provider: String
  model: String
  workingDirectory: String
}

input SendAiChatMessageInput {
  sessionId: String!
  content: String!
}

input UpsertProviderConfigInput {
  provider: String!
  cliPath: String
  apiKey: String
  defaultModel: String
  settings: String
}

input CreateAgentPlanInput {
  runType: String
  title: String
  workspacePath: String!
  planPath: String!
  workerProvider: String!
  reviewerProvider: String!
  brief: String
  appScope: String
  docsScope: String
  referencePaths: String
}

input PlannerPromptSettingsInput {
  development: PlannerDevelopmentPromptsInput!
  planning: PlannerPlanningPromptsInput!
}

input PlannerDevelopmentPromptsInput {
  worker: String!
  reviewer: String!
}

input PlannerPlanningPromptsInput {
  planner: String!
  reviewer: String!
}

# --- Queries ---

type Query {
  listDesktopNodes: [DesktopNode!]!
  listAiSessions(status: String): [AiSession!]!
  getAiSession(id: ID!): AiSession
  listAiMessages(sessionId: ID!, limit: Int, offset: Int): [AiMessage!]!
  listProviderConfigs: [ProviderConfig!]!
  listDetectedCliTools: [DetectedTool!]!
  getSetting(key: String!): String!
  getPlannerPromptSettings: PlannerPromptSettings!
  listAgentPlans(status: String, runType: String): [AgentPlan!]!
  getAgentPlan(id: ID!): AgentPlanRun!
  browseHostDirectory(path: String!): [HostFileEntry!]!
  validateWorkspacePlan(workspacePath: String!, planPath: String!): WorkspaceValidation!
  listWorkspaceFiles(planId: ID!, mode: String!): [HostFileEntry!]!
  readHostFile(planId: ID!, path: String!): HostFileContent!
  getWorkspaceFileDiff(planId: ID!, path: String!): WorkspaceFileDiff!
}

# --- Mutations ---

type Mutation {
  createAiSession(input: CreateAiSessionInput!): AiSession!
  updateAiSessionTitle(id: ID!, title: String!): AiSession!
  updateAiSessionWorkingDirectory(id: ID!, workingDirectory: String!): AiSession!
  updateAiSessionProvider(id: ID!, provider: String!): AiSession!
  updateAiSessionArchived(id: ID!): AiSession!
  registerDesktopNode(input: RegisterDesktopNodeInput!): DesktopNode!
  updateDesktopNodeStatus(id: ID!, status: DesktopNodeStatus!): DesktopNode!
  sendRelayChatMessage(input: RelayChatMessageInput!): RelayChatResponse!
  sendAiChatMessage(input: SendAiChatMessageInput!): AiChatRunResult!
  cancelAiGeneration(sessionId: ID!): Boolean!
  deleteAiSession(id: ID!): Boolean!
  upsertProviderConfig(input: UpsertProviderConfigInput!): ProviderConfig!
  deleteProviderConfig(provider: String!): Boolean!
  updateSetting(key: String!, value: String!): Boolean!
  updatePlannerPromptSettings(input: PlannerPromptSettingsInput!): PlannerPromptSettings!
  createAgentPlan(input: CreateAgentPlanInput!): AgentPlanRun!
  startAgentPlan(id: ID!, phaseId: String): AgentPlanRun!
  updateAgentPlanStopped(id: ID!): AgentPlanRun!
  deleteAgentPlan(id: ID!): Boolean!
  updateAgentPlanBlocked(id: ID!, reason: String!): AgentPlanRun!
  updateAgentPhaseManualPass(id: ID!, phaseId: String!): AgentPlanRun!
  sendAgentFeedbackToWorker(id: ID!): AgentPlanRun!
  retryAgentReviewer(id: ID!): AgentPlanRun!
}

# --- Subscriptions ---

type Subscription {
  onDesktopNodeStatus: DesktopNode!
  onAiChatDelta(sessionId: String!): AiChatDelta!
  onAiChatComplete(sessionId: String!): AiChatComplete!
  onRelayChatDelta(relayId: String!): RelayChatDelta!
  onRelayChatMessage(sessionId: String!): RelayChatMessage!
}
