project:
  name: JohnnyOne
  slug: johnnyone
  tenant_id: johnnyone-default

cloudflare:
  account: elitechance

app:
  worker:
    dir: worker
    modules:
      - name: auth
        features:
          password: true
          oauth: []
          passkey: false

  d1:
    name: johnnyone-db
    migrations: worker/d1/migrations
    seeds: worker/d1/seeds

  builds:
    edge:
      kind: worker
      cwd: .
      command:
        local: nx build worker
        dev: nx build worker
        prod: nx build worker
      outputs:
        - dist/worker

    desktop:
      kind: binary
      cwd: desktop/src-tauri
      command:
        local: cargo build --bin johnnyone-desktop
        dev: cargo build --bin johnnyone-desktop
        prod: cargo build --release --bin johnnyone-desktop
      outputs:
        - target/release/johnnyone-desktop

    web:
      kind: web
      cwd: .
      command:
        local: nx build web
        dev: nx build web
        prod: nx build web
      outputs:
        - dist/web/browser

local:
  hooks:
    pre_sim:
      - nx build web
  processes:
    desktop:
      # The single consolidated Tauri binary — embeds the host's :7788
      # GraphQL listener AND opens the JohnnyOne window.
      # If you don't have a display (headless dev), comment this out and connect
      # the local web client directly at the deployed worker URL.
      kind: service
      cwd: desktop/src-tauri
      command: cargo run --bin johnnyone-desktop
      env:
        JOHNNYONE_HOST_ADDR: 127.0.0.1:7788
        JOHNNYONE_WORKER_URL: http://127.0.0.1:7714
        JOHNNYONE_TENANT_ID: 00000000-0000-0000-0000-000000000001
        JOHNNYONE_USER_ID: 00000000-0000-0000-0000-000000000002
      ready:
        type: graphql
        url: http://127.0.0.1:7788/graphql
        query: "query { health }"
    edge:
      kind: worker
      cwd: .
      command: npx lokal cf worker sim --project johnnyone --worker-dir worker --port 7714
      # HOST_GRAPHQL_URL removed in Phase 2 of multi-user-saas plan — forward
      # path replaced by relay-RPC via ChatRelayDO (worker/lib/runtime/relay-rpc.ts).
      depends_on:
        - desktop
      ready:
        type: graphql
        url: http://127.0.0.1:7714/graphql
        query: "query { __typename }"
    web:
      kind: frontend
      cwd: web
      command: npx ng serve --port 4200
      depends_on:
        - edge
      ready:
        type: http
        url: http://127.0.0.1:4200
  profiles:
    default:
      build:
        - desktop
        - edge
        - web
      run:
        - desktop
        - edge
        - web
  default_profile: default

environments:
  local:
    worker_port: 7714
    frontend_port: 4200
    domain: localhost:4200
    worker_domain: localhost:7714
  dev:
    # No custom worker_domain on elitechance for now — deploy uses CF's auto-assigned
    # *.workers.dev URL. To wire a custom domain, add a zone to ~/.lokal/cf.yaml's
    # elitechance entry (e.g. videokestar.com subdomain) and set worker_domain here.
  prod:
    # Live worker: johnnyone → https://johnnyone.<account>.workers.dev
    # Deploy: lokal cf worker deploy --env prod (see docs/operations.md)

secrets:
  - JWT_SECRET
