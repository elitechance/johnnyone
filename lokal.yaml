project:
  name: JohnnyOne
  slug: johnnyone
  tenant_id: johnnyone-default

cloudflare:
  account: static

app:
  worker:
    dir: worker
    modules:
      - name: auth
        features:
          password: true
          oauth: []
          passkey: false

  d1:
    name: johnnyone-db
    migrations: worker/d1/migrations
    seeds: worker/d1/seeds

  builds:
    edge:
      kind: worker
      cwd: .
      command:
        local: nx build worker
        dev: nx build worker
        prod: nx build worker
      outputs:
        - dist/worker

    host:
      kind: binary
      cwd: desktop/src-tauri
      command:
        local: cargo build --bin johnnyone-host
        dev: cargo build --bin johnnyone-host
        prod: cargo build --release --bin johnnyone-host
      outputs:
        - target/debug/johnnyone-host

    desktop-web:
      kind: web
      cwd: .
      command:
        local: nx build desktop
        dev: nx build desktop
        prod: nx build desktop
      outputs:
        - dist/desktop/browser

    mobile-web:
      kind: mobile
      cwd: .
      command:
        local: nx build mobile
        dev: nx build mobile
        prod: nx build mobile
      outputs:
        - dist/mobile

local:
  hooks:
    pre_sim:
      - nx build desktop
  processes:
    host:
      kind: service
      cwd: desktop/src-tauri
      command: cargo run --bin johnnyone-host
      env:
        JOHNNYONE_HOST_ADDR: 127.0.0.1:7788
        JOHNNYONE_WORKER_URL: http://127.0.0.1:7714
        JOHNNYONE_TENANT_ID: 00000000-0000-0000-0000-000000000001
        JOHNNYONE_USER_ID: 00000000-0000-0000-0000-000000000002
      ready:
        type: graphql
        url: http://127.0.0.1:7788/graphql
        query: "query { health }"
    edge:
      kind: worker
      cwd: .
      command: npx lokal cf worker sim --project johnnyone --worker-dir worker --port 7714
      env:
        HOST_GRAPHQL_URL: http://127.0.0.1:7788/graphql
      depends_on:
        - host
      ready:
        type: graphql
        url: http://127.0.0.1:7714/graphql
        query: "query { __typename }"
    desktop:
      kind: frontend
      cwd: desktop
      command: npx ng serve --port 4200
      depends_on:
        - edge
      ready:
        type: http
        url: http://127.0.0.1:4200
    mobile:
      kind: mobile
      cwd: mobile
      command: npx ng serve --port 4201
      depends_on:
        - edge
      ready:
        type: http
        url: http://127.0.0.1:4201
  profiles:
    desktop:
      build:
        - host
        - edge
        - desktop-web
      run:
        - host
        - edge
        - desktop
    mobile:
      build:
        - host
        - edge
        - mobile-web
      run:
        - host
        - edge
        - mobile
    full:
      build:
        - host
        - edge
        - desktop-web
        - mobile-web
      run:
        - host
        - edge
        - desktop
        - mobile
  default_profile: desktop

environments:
  local:
    worker_port: 7714
    frontend_port: 4200
    domain: localhost:4200
    worker_domain: localhost:7714
  dev:
    worker_domain: dev-johnnyone.lokalbase.app
  prod:
    worker_domain: johnnyone.lokalbase.app

secrets:
  - JWT_SECRET
